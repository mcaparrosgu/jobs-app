# Puerta de calidad y publicación de Jobs App (Paso 16).
#
# Antes, Vercel publicaba solo en cuanto llegaba un push. Ahora publica este
# robot, y solo si las comprobaciones pasan. Si algo está en rojo, la web que
# ven las usuarias NO cambia.
#
# El orden es siempre el mismo:
#
#   1. decidir       ¿este cambio toca la IA? ¿lleva el freno "[sin evals]"?
#   2. comprobar     lint + pruebas (rápido, gratis, no llama a ninguna IA)
#   3. evals         solo si toca la IA. Llama a Groq de verdad y gasta cuota
#   4. publicar      vista previa en cualquier rama, producción solo en master
#
# Para deshacer una publicación mala, NO hace falta este robot: se hace en el
# panel de Vercel en 30 segundos. Ver docs/07-emergencia.md.

name: Publicar

on:
  push:
    branches: ['**']
  pull_request:
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub, por ejemplo
  # para reintentar unos evals que salieron "no concluyentes" por falta de
  # cuota, sin tener que inventarse un commit.
  workflow_dispatch:

# Si haces dos pushes seguidos a la misma rama, el primero se cancela: no tiene
# sentido publicar una versión que ya está superada, y ahorra cuota de evals.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Estos dos NO son secretos: identifican el proyecto, no dan acceso a nada.
  # El que sí lo es (VERCEL_TOKEN) vive en Settings → Secrets del repositorio.
  VERCEL_ORG_ID: team_re1pN0Cr5HU7wbuaIKJ5NMPR
  VERCEL_PROJECT_ID: prj_2W8yk0mwvGZZ3uyBwwVxuI1DNL38

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1 · ¿Hace falta gastar cuota de IA en este cambio?
  # ─────────────────────────────────────────────────────────────────────
  decidir:
    name: Decidir si hacen falta los evals
    runs-on: ubuntu-latest
    outputs:
      lanzar_evals: ${{ steps.mirar.outputs.lanzar_evals }}
      motivo: ${{ steps.mirar.outputs.motivo }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: mirar
        name: Mirar qué archivos han cambiado
        env:
          ANTES: ${{ github.event.before }}
          AHORA: ${{ github.sha }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          EVENTO: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Los archivos de los que depende la calidad de la IA. Es la misma
          # regla que CLAUDE.md pide cumplir a mano; aquí la cumple la máquina.
          RUTAS_DE_IA='^(lib/ia\.ts|prompts/system\.md|lib/guardrails\.ts|lib/verificarCv\.ts|evals/)'

          # En una RAMA se compara siempre contra master, no contra el empujón
          # anterior. La diferencia importa: si comparas solo el último push,
          # una rama que ya traía un prompt cambiado se salta los evals en
          # cuanto haces encima un commit de documentación — el cambio de
          # prompt acaba en la vista previa sin haberse medido nunca.
          # (Pasó en la ejecución #4 del 20/08/2026.)
          #
          # En MASTER sí se compara con el empujón anterior: ahí lo que llega
          # es justo lo que se va a publicar.
          RAMA="${GITHUB_REF#refs/heads/}"

          if [ "$EVENTO" = "pull_request" ]; then
            CAMBIADOS=$(git diff --name-only "$BASE_PR" "$AHORA")
          elif [ "$RAMA" != "master" ]; then
            git fetch --no-tags --depth=100 origin master 2>/dev/null || true
            BASE_RAMA=$(git merge-base FETCH_HEAD "$AHORA" 2>/dev/null || echo '')

            if [ -n "$BASE_RAMA" ] && [ "$BASE_RAMA" != "$AHORA" ]; then
              CAMBIADOS=$(git diff --name-only "$BASE_RAMA" "$AHORA")
            else
              # No se pudo comparar con master: ante la duda, se evalúa.
              CAMBIADOS=$(git ls-files)
            fi
          elif [ -n "${ANTES:-}" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            CAMBIADOS=$(git diff --name-only "$ANTES" "$AHORA")
          else
            # Primer push de master, o ejecución a mano: no hay con qué
            # comparar. Ante la duda, se evalúa.
            CAMBIADOS=$(git ls-files)
          fi

          echo "Archivos cambiados:"
          echo "$CAMBIADOS" | sed 's/^/  /'

          # El mensaje del commit se LEE con git, nunca se interpola dentro del
          # script: un mensaje con comillas o acentos graves podría ejecutar
          # comandos aquí dentro (lección del Paso 15).
          MENSAJE=$(git log -1 --pretty=%B)

          if echo "$MENSAJE" | grep -qiF '[sin evals]'; then
            echo "lanzar_evals=false" >> "$GITHUB_OUTPUT"
            echo "motivo=El commit lleva el freno [sin evals]" >> "$GITHUB_OUTPUT"
          elif echo "$CAMBIADOS" | grep -qE "$RUTAS_DE_IA"; then
            echo "lanzar_evals=true" >> "$GITHUB_OUTPUT"
            echo "motivo=El cambio toca la IA" >> "$GITHUB_OUTPUT"
          else
            echo "lanzar_evals=false" >> "$GITHUB_OUTPUT"
            echo "motivo=El cambio no toca la IA" >> "$GITHUB_OUTPUT"
          fi

      - name: Anotar la decisión
        run: |
          {
            echo "### Evals del Paso 13"
            echo ""
            echo "- ¿Se lanzan? **${{ steps.mirar.outputs.lanzar_evals }}**"
            echo "- Motivo: ${{ steps.mirar.outputs.motivo }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────
  # 2 · Lo rápido y gratis: se hace siempre
  # ─────────────────────────────────────────────────────────────────────
  comprobar:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas automáticas (Paso 12)
        run: npm test

  # ─────────────────────────────────────────────────────────────────────
  # 3 · Los evals: solo cuando el cambio toca la IA
  # ─────────────────────────────────────────────────────────────────────
  evals:
    name: Puerta de calidad de la IA
    needs: decidir
    if: needs.decidir.outputs.lanzar_evals == 'true'
    runs-on: ubuntu-latest
    # Medido en vivo el 20/08/2026: extraerPerfil 3m 14s, generarCvYCarta unos
    # 12 minutos cuando el modelo responde de verdad. Con los dos topes de
    # PROMPTFOO_MAX_EVAL_TIME_MS (20 min por suite) el peor caso son 40; 60 deja
    # margen para que el paso del veredicto llegue a ejecutarse y explique qué
    # ha pasado, en vez de que GitHub mate el trabajo sin dejar rastro.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Las claves llegan como secretos del repositorio, no desde Vercel.
      #
      # El primer intento fue traerlas con `vercel env pull` para no duplicar
      # secretos. No funciona: las cinco variables del proyecto son de tipo
      # **Sensitive**, y ese tipo es de solo escritura — su valor no se puede
      # volver a leer, ni desde el panel ni con el CLI. La descarga dice
      # "Created .env.local" y aun así la clave llega vacía, así que Groq
      # responde 401 "Invalid API Key" y los 25 casos salen sin evaluar.
      # (Verificado en vivo el 20/08/2026, ejecución #1 del robot.)
      #
      # Comprobar antes de tocar esto: la clave de `.env.local` responde 200 a
      # https://api.groq.com/openai/v1/models. Si el robot da 401 con la misma
      # clave, el problema es el secreto de GitHub, no Groq.
      - name: Comprobar que las claves han llegado
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::Falta el secreto GROQ_API_KEY del repositorio."
            echo "Ponlo en Settings -> Secrets and variables -> Actions."
            echo "Sin el, los 25 casos saldrian 'sin evaluar' con un 401 y"
            echo "pareceria un problema de calidad sin serlo."
            exit 1
          fi
          # Una peticion de verdad, minuscula (5 tokens), al mismo modelo que
          # usa la app. Listar modelos no basta: responde 200 aunque la cuota
          # del dia este agotada, y entonces los 25 casos se van 25 minutos
          # para acabar en "no concluyente" por un 429 que se podia haber
          # visto en dos segundos. (Verificado en vivo: ejecucion #3, 26m 55s
          # tirados por esto.)
          #
          # Solo se imprime el codigo de respuesta; la clave, nunca.
          CODIGO=$(curl -s -o /dev/null -w '%{http_code}' \
            https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen/qwen3.6-27b","messages":[{"role":"user","content":"ok"}],"max_tokens":5,"reasoning_effort":"none"}')

          echo "Groq responde $CODIGO a una peticion de prueba."

          case "$CODIGO" in
            200)
              echo "Clave correcta y con cuota. Adelante."
              ;;
            401|403)
              echo "::error::La clave de Groq del robot no vale (codigo $CODIGO)."
              echo "Revisa el secreto GROQ_API_KEY en Settings -> Secrets and variables -> Actions."
              exit 1
              ;;
            429)
              echo "::error::Groq no tiene cuota ahora mismo (429). NO es un problema de calidad."
              echo "La cuota diaria se renueva a medianoche UTC (2:00 en España)."
              echo "Vuelve a lanzarlo entonces desde Actions -> Publicar -> Run workflow."
              echo "Si el cambio no toca ningun prompt, el commit puede llevar [sin evals]."
              exit 1
              ;;
            *)
              echo "::error::Groq responde $CODIGO. No se lanzan los evals para no tirar 25 minutos."
              exit 1
              ;;
          esac

      # `-j 1` y las pausas son obligatorias desde que Groq es el proveedor
      # principal, porque limita por TOKENS POR MINUTO (8.000 en esta cuenta) y
      # esa cuenta suma la entrada MAS el `max_tokens` pedido, se gaste o no.
      #
      # Las pausas salen de una division, no de una corazonada. `lib/ia.ts` ya
      # lo dice: "una generacion reserva del orden de 7.000 de esos 8.000
      # tokens, asi que por minuto cabe UNA generacion, o dos o tres
      # extracciones".
      #
      #   extraerPerfil    ~2.000 tokens/caso -> 25 s entre casos = 4.800 TPM
      #   generarCvYCarta  ~7.000 tokens/caso -> 65 s entre casos = 6.500 TPM
      #
      # Los valores anteriores (15 s y 20 s) pedian 8.000 y 21.000 TPM: el
      # segundo era 2,6 veces el limite, asi que el 429 estaba garantizado.
      # Verificado en vivo (ejecucion #3): 26m 55s para acabar en "no
      # concluyente" con medio dataset sin evaluar.
      #
      # `|| true` deja que el eval termine aunque haya casos en rojo: quien
      # decide no es promptfoo, es la puerta del paso siguiente.
      - name: Evals · extraerPerfil (12 casos)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPTFOO_EVAL_TIMEOUT_MS: '180000'
          PROMPTFOO_MAX_EVAL_TIME_MS: '900000'
        run: |
          npx promptfoo eval -c evals/promptfoo/extraer-perfil.yaml \
            -j 1 --delay 25000 \
            -o evals/promptfoo/resultado-perfil.json || true

      - name: Evals · generarCvYCarta (13 casos)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPTFOO_EVAL_TIMEOUT_MS: '180000'
          PROMPTFOO_MAX_EVAL_TIME_MS: '1800000'
        run: |
          npx promptfoo eval -c evals/promptfoo/generar-cv-carta.yaml \
            -j 1 --delay 65000 \
            -o evals/promptfoo/resultado-generar.json || true

      # Aquí está la puerta. Sale con 0 (verde), 1 (rojo de calidad) o 2 (no
      # concluyente: sin cuota, juez caído...). Cualquiera que no sea 0 detiene
      # la publicación, pero el mensaje distingue de qué se trata.
      - name: Veredicto
        shell: bash
        run: |
          # `pipefail` es imprescindible aquí: sin él, el código de salida de la
          # tubería sería el de `tee` (siempre 0) y la puerta no bloquearía
          # nunca — parecería montada y no lo estaría.
          set -uo pipefail
          node evals/puerta-calidad.mjs \
            evals/promptfoo/resultado-perfil.json \
            evals/promptfoo/resultado-generar.json | tee veredicto.txt
          exit "${PIPESTATUS[0]}"

      - name: Anotar el veredicto
        if: always()
        run: |
          {
            echo '### Veredicto de los evals'
            echo ''
            echo '```'
            cat veredicto.txt 2>/dev/null || echo 'La puerta no llegó a dar un veredicto.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────
  # 4 · Publicar. Solo si todo lo anterior fue bien.
  # ─────────────────────────────────────────────────────────────────────
  publicar:
    name: Publicar en Vercel
    needs: [decidir, comprobar, evals]
    # `always()` hace que este trabajo se evalúe aunque "evals" se haya
    # saltado; las condiciones de dentro son las que mandan de verdad.
    # "skipped" cuenta como bueno (no había que lanzarlos); "failure" no.
    # `decidir` también tiene que haber ido bien: si reventara, "evals" se
    # saltaría y quedaría en "skipped", que es justo lo que aquí se acepta como
    # bueno. Sin esta línea, un fallo al decidir publicaría sin pasar los evals.
    if: |
      always()
      && needs.decidir.result == 'success'
      && needs.comprobar.result == 'success'
      && (needs.evals.result == 'success' || needs.evals.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar la herramienta de Vercel
        run: npm install --global vercel@latest

      - name: Decidir producción o vista previa
        id: destino
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "entorno=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
            echo "etiqueta=PRODUCCIÓN (la web que ven tus compañeras)" >> "$GITHUB_OUTPUT"
          else
            echo "entorno=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "etiqueta=vista previa (nadie más la ve)" >> "$GITHUB_OUTPUT"
          fi

      - name: Traer la configuración del proyecto
        run: vercel pull --yes --environment=${{ steps.destino.outputs.entorno }} --token=${{ secrets.VERCEL_TOKEN }}

      # Construye VERCEL, no este robot. La versión anterior hacía
      # `vercel build` aquí y subía el resultado ya hecho con `--prebuilt`;
      # parecía mejor (más control, un paso menos en Vercel) y estaba roto:
      #
      # Las variables `NEXT_PUBLIC_*` no se leen en tiempo de ejecución, se
      # INCRUSTAN dentro del código durante la construcción. Y como las cinco
      # variables del proyecto son de tipo **Sensitive**, su valor no se puede
      # recuperar desde fuera de Vercel — el mismo motivo por el que las claves
      # de IA tuvieron que pasar a secretos de GitHub. Resultado: el build de
      # aquí incrustaba una URL de Supabase vacía y la vista previa moría con
      # "Invalid supabaseUrl: Must be a valid HTTP or HTTPS URL" en el
      # middleware, con un escueto "Internal Server Error" en pantalla.
      # (Verificado en vivo el 20/08/2026, ejecución #4.)
      #
      # Construyendo en Vercel, las variables están donde tienen que estar. Se
      # pagan ~2 minutos más por despliegue; la puerta de calidad sigue siendo
      # este robot, que es lo que importa.
      - name: Publicar
        id: desplegar
        run: |
          URL=$(vercel deploy ${{ steps.destino.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Publicado en $URL"

      - name: Anotar dónde ha quedado
        run: |
          {
            echo '### Publicado'
            echo ''
            echo "- Destino: **${{ steps.destino.outputs.etiqueta }}**"
            echo "- Dirección: ${{ steps.desplegar.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
