# Puerta de calidad y publicación de Jobs App (Paso 16).
#
# Antes, Vercel publicaba solo en cuanto llegaba un push. Ahora publica este
# robot, y solo si las comprobaciones pasan. Si algo está en rojo, la web que
# ven las usuarias NO cambia.
#
# El orden es siempre el mismo:
#
#   1. decidir       ¿este cambio toca la IA? ¿lleva el freno "[sin evals]"?
#   2. comprobar     lint + pruebas (rápido, gratis, no llama a ninguna IA)
#   3. evals         solo si toca la IA. Llama a Cloudflare de verdad y gasta cuota
#   4. publicar      vista previa en cualquier rama, producción solo en master
#
# Para deshacer una publicación mala, NO hace falta este robot: se hace en el
# panel de Vercel en 30 segundos. Ver docs/07-emergencia.md.

name: Publicar

on:
  push:
    branches: ['**']
  pull_request:
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub, por ejemplo
  # para reintentar unos evals que salieron "no concluyentes" por falta de
  # cuota, sin tener que inventarse un commit.
  workflow_dispatch:

# Si haces dos pushes seguidos a la misma rama, el primero se cancela: no tiene
# sentido publicar una versión que ya está superada, y ahorra cuota de evals.
concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Estos dos NO son secretos: identifican el proyecto, no dan acceso a nada.
  # El que sí lo es (VERCEL_TOKEN) vive en Settings → Secrets del repositorio.
  VERCEL_ORG_ID: team_re1pN0Cr5HU7wbuaIKJ5NMPR
  VERCEL_PROJECT_ID: prj_2W8yk0mwvGZZ3uyBwwVxuI1DNL38

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1 · ¿Hace falta gastar cuota de IA en este cambio?
  # ─────────────────────────────────────────────────────────────────────
  decidir:
    name: Decidir si hacen falta los evals
    runs-on: ubuntu-latest
    outputs:
      lanzar_evals: ${{ steps.mirar.outputs.lanzar_evals }}
      motivo: ${{ steps.mirar.outputs.motivo }}
      base: ${{ steps.mirar.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: mirar
        name: Mirar qué archivos han cambiado
        env:
          AHORA: ${{ github.sha }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          EVENTO: ${{ github.event_name }}
          # T115 · Solo para PREGUNTAR qué hay publicado. Aquí no se despliega
          # nada; el token se usa en una única lectura contra la API de Vercel.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          # Los archivos de los que depende la calidad de la IA. Es la misma
          # regla que CLAUDE.md pide cumplir a mano; aquí la cumple la máquina.
          RUTAS_DE_IA='^(lib/ia\.ts|prompts/system\.md|lib/guardrails\.ts|lib/verificarCv\.ts|evals/)'

          # En una RAMA se compara siempre contra master, no contra el empujón
          # anterior. La diferencia importa: si comparas solo el último push,
          # una rama que ya traía un prompt cambiado se salta los evals en
          # cuanto haces encima un commit de documentación — el cambio de
          # prompt acaba en la vista previa sin haberse medido nunca.
          # (Pasó en la ejecución #4 del 20/08/2026.)
          #
          # En MASTER la base es LO QUE HAY PUBLICADO, no el empujón anterior.
          # T115, descubierta el 26/08/2026: comparar con el push anterior da
          # por supuesto que ese push se publicó, y no siempre es verdad. Si la
          # puerta lo bloqueó (ROJO o NO CONCLUYENTE), el código se quedó en
          # master sin desplegar, y el siguiente commit inocuo — una nota en
          # docs/, un script de diagnóstico — ya no veía el cambio de IA como
          # "cambiado" y lo arrastraba a producción **sin evals**, diciendo con
          # toda honestidad "El cambio no toca la IA". La puerta no protegía a
          # producción: solo retrasaba el cambio malo hasta el commit siguiente.
          # Ver knowledge/agujero-robot-cambio-ia-arrastrado.md.
          RAMA="${GITHUB_REF#refs/heads/}"

          if [ "$EVENTO" = "pull_request" ]; then
            BASE_USADA="la rama de destino del PR"
            CAMBIADOS=$(git diff --name-only "$BASE_PR" "$AHORA")
          elif [ "$RAMA" != "master" ]; then
            git fetch --no-tags --depth=100 origin master 2>/dev/null || true
            BASE_RAMA=$(git merge-base FETCH_HEAD "$AHORA" 2>/dev/null || echo '')

            if [ -n "$BASE_RAMA" ] && [ "$BASE_RAMA" != "$AHORA" ]; then
              BASE_USADA="master ($BASE_RAMA)"
              CAMBIADOS=$(git diff --name-only "$BASE_RAMA" "$AHORA")
            else
              # No se pudo comparar con master: ante la duda, se evalúa.
              BASE_USADA="nada (no se pudo comparar con master): se evalúa todo"
              CAMBIADOS=$(git ls-files)
            fi
          else
            # Se le pregunta a Vercel qué commit está servido AHORA MISMO en
            # producción. Se mira `targets.production` del proyecto y no el
            # despliegue más reciente, porque no son lo mismo: después de un
            # rollback (docs/07-emergencia.md §1) el más reciente NO es el que
            # está servido, y usarlo dejaría fuera del diff justo el cambio que
            # se acaba de deshacer.
            SHA_PROD=''
            if [ -n "${VERCEL_TOKEN:-}" ]; then
              RESPUESTA=$(curl -sS --max-time 20                 -H "Authorization: Bearer $VERCEL_TOKEN"                 "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}"                 || echo '')
              # `meta.sha` lo pone este mismo robot al desplegar (--meta sha=),
              # así que es dato nuestro y no depende de que Vercel adivine el
              # commit — que no puede: el repositorio se desconectó del
              # proyecto el 21/08/2026. `githubCommitSha` queda de respaldo
              # para los despliegues anteriores a este cambio.
              SHA_PROD=$(printf '%s' "$RESPUESTA"                 | jq -r '.targets.production.meta.sha // .targets.production.meta.githubCommitSha // empty'                 2>/dev/null || echo '')
            fi

            if [ -n "$SHA_PROD" ] && git cat-file -e "${SHA_PROD}^{commit}" 2>/dev/null; then
              BASE_USADA="lo que hay publicado en producción ($SHA_PROD)"
              CAMBIADOS=$(git diff --name-only "$SHA_PROD" "$AHORA")
            else
              # Sin saber qué hay publicado no se puede afirmar que este cambio
              # no toca la IA. Se evalúa: cuesta cuota, pero la alternativa es
              # publicar a ciegas, que es exactamente el agujero de T115.
              #
              # Pasa, y es normal, en la PRIMERA publicación después de este
              # cambio: el despliegue que hay en producción todavía no lleva la
              # marca `--meta sha=`. A partir de la siguiente, ya la lleva.
              BASE_USADA="nada (Vercel no dijo qué hay publicado): se evalúa todo"
              CAMBIADOS=$(git ls-files)
            fi
          fi

          echo "Base de comparación: $BASE_USADA"
          echo "base=$BASE_USADA" >> "$GITHUB_OUTPUT"
          echo "Archivos cambiados:"
          echo "$CAMBIADOS" | sed 's/^/  /'

          # El mensaje del commit se LEE con git, nunca se interpola dentro del
          # script: un mensaje con comillas o acentos graves podría ejecutar
          # comandos aquí dentro (lección del Paso 15).
          #
          # Solo se mira el ASUNTO (primera línea), no el cuerpo entero: un
          # commit que solo *describe* el freno en una viñeta del cuerpo (p.
          # ej. "El freno [sin evals] funciona") activaba el freno de verdad
          # y saltaba la puerta sin querer. Pasó en la publicación a master
          # del 21/08/2026 (commit 0d4992d) — la puerta no llegó a correr.
          #
          # Y no basta con mirar solo el asunto: además tiene que estar AL
          # FINAL de esa línea, no en cualquier parte. El propio commit que
          # arregló lo anterior volvió a activar el freno sin querer, porque
          # su asunto mencionaba "[sin evals]" a mitad de frase. Los usos
          # reales de la marca siempre la ponen al final — es la convención
          # que ya se seguía sin estar escrita.
          MENSAJE=$(git log -1 --pretty=%s)

          if echo "$MENSAJE" | grep -qiE '\[sin evals\][[:space:]]*$'; then
            echo "lanzar_evals=false" >> "$GITHUB_OUTPUT"
            echo "motivo=El commit lleva el freno [sin evals]" >> "$GITHUB_OUTPUT"
          elif echo "$CAMBIADOS" | grep -qE "$RUTAS_DE_IA"; then
            echo "lanzar_evals=true" >> "$GITHUB_OUTPUT"
            echo "motivo=El cambio toca la IA" >> "$GITHUB_OUTPUT"
          else
            echo "lanzar_evals=false" >> "$GITHUB_OUTPUT"
            echo "motivo=El cambio no toca la IA" >> "$GITHUB_OUTPUT"
          fi

      - name: Anotar la decisión
        run: |
          {
            echo "### Evals del Paso 13"
            echo ""
            echo "- ¿Se lanzan? **${{ steps.mirar.outputs.lanzar_evals }}**"
            echo "- Motivo: ${{ steps.mirar.outputs.motivo }}"
            echo "- Comparado contra: ${{ steps.mirar.outputs.base }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────
  # 2 · Lo rápido y gratis: se hace siempre
  # ─────────────────────────────────────────────────────────────────────
  comprobar:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas automáticas (Paso 12)
        run: npm test

  # ─────────────────────────────────────────────────────────────────────
  # 3 · Los evals: solo cuando el cambio toca la IA
  # ─────────────────────────────────────────────────────────────────────
  evals:
    name: Puerta de calidad de la IA
    needs: decidir
    if: needs.decidir.outputs.lanzar_evals == 'true'
    runs-on: ubuntu-latest
    # Medido en vivo el 20/08/2026: extraerPerfil 3m 14s, generarCvYCarta unos
    # 12 minutos cuando el modelo responde de verdad. Con los dos topes de
    # PROMPTFOO_MAX_EVAL_TIME_MS (20 min por suite) el peor caso son 40; 60 deja
    # margen para que el paso del veredicto llegue a ejecutarse y explique qué
    # ha pasado, en vez de que GitHub mate el trabajo sin dejar rastro.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Las claves llegan como secretos del repositorio, no desde Vercel.
      #
      # El primer intento fue traerlas con `vercel env pull` para no duplicar
      # secretos. No funciona: las variables del proyecto son de tipo
      # **Sensitive**, y ese tipo es de solo escritura — su valor no se puede
      # volver a leer, ni desde el panel ni con el CLI. La descarga dice
      # "Created .env.local" y aun así la clave llega vacía, así que el
      # proveedor responde 401 "Invalid API Key" y los 25 casos salen sin
      # evaluar. (Verificado en vivo el 20/08/2026, ejecución #1 del robot.)
      #
      # Dos claves a comprobar, con roles distintos desde que Groq se retiró
      # del todo el 23/08/2026 (decisión de Mar, lib/ia.ts):
      #   - CLOUDFLARE_*: el proveedor PRINCIPAL de las dos llamadas reales
      #     que hace la app (extraerPerfil y generarCvYCarta).
      #   - GROQ_API_KEY: ya NO la usa la app, pero sí el juez de las
      #     aserciones "llm-rubric" en extraer-perfil.yaml y
      #     generar-cv-carta.yaml (elegido por privacidad, mismo motivo que
      #     cuando era el principal). Sin ella, esas aserciones fallan con un
      #     "no concluyente" que parece un problema de calidad y no lo es.
      - name: Comprobar que las claves han llegado
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Falta CLOUDFLARE_ACCOUNT_ID o CLOUDFLARE_API_TOKEN del repositorio."
            echo "Ponlos en Settings -> Secrets and variables -> Actions."
            echo "Sin ellos, la app no tiene proveedor principal y los evals"
            echo "caerian a OpenRouter en silencio, o fallarian si tampoco"
            echo "responde."
            exit 1
          fi
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::Falta el secreto GROQ_API_KEY del repositorio."
            echo "Ponlo en Settings -> Secrets and variables -> Actions."
            echo "Ya no lo usa la app, pero si el juez de las aserciones"
            echo "llm-rubric: sin el, esos casos saldrian 'sin evaluar'."
            exit 1
          fi
          # Una peticion de verdad, minuscula (5 tokens), a Cloudflare. Listar
          # modelos no basta: responde 200 aunque la cuota del dia este
          # agotada, y entonces los 25 casos se van 25 minutos para acabar en
          # "no concluyente" por un 429 que se podia haber visto en dos
          # segundos (leccion de Groq, ejecucion #3, 26m 55s tirados).
          #
          # Solo se imprime el codigo de respuesta; la clave, nunca.
          CODIGO_CF=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1/chat/completions" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"model":"@cf/mistralai/mistral-small-3.1-24b-instruct","messages":[{"role":"user","content":"ok"}],"max_tokens":5}')

          echo "Cloudflare responde $CODIGO_CF a una peticion de prueba."

          case "$CODIGO_CF" in
            200)
              echo "Clave de Cloudflare correcta y con cuota. Adelante."
              ;;
            401|403)
              echo "::error::La clave de Cloudflare del robot no vale (codigo $CODIGO_CF)."
              echo "Revisa CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_API_TOKEN en Settings -> Secrets and variables -> Actions."
              exit 1
              ;;
            429)
              echo "::error::Cloudflare no tiene cuota ahora mismo (429). NO es un problema de calidad."
              echo "El cupo diario de neuronas se renueva cada dia."
              echo "Vuelve a lanzarlo mas tarde desde Actions -> Publicar -> Run workflow."
              echo "Si el cambio no toca ningun prompt, el commit puede llevar [sin evals]."
              exit 1
              ;;
            *)
              echo "::error::Cloudflare responde $CODIGO_CF. No se lanzan los evals para no tirar 25 minutos."
              exit 1
              ;;
          esac

          # Groq ya no genera ni extrae nada, pero el juez de las aserciones
          # llm-rubric (extraer-perfil.yaml, generar-cv-carta.yaml) sigue
          # llamandolo — misma comprobacion minima que antes.
          CODIGO_GROQ=$(curl -s -o /dev/null -w '%{http_code}' \
            https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen/qwen3.6-27b","messages":[{"role":"user","content":"ok"}],"max_tokens":5,"reasoning_effort":"none"}')

          echo "Groq (juez) responde $CODIGO_GROQ a una peticion de prueba."

          case "$CODIGO_GROQ" in
            200)
              echo "Clave del juez correcta y con cuota. Adelante."
              ;;
            401|403)
              echo "::error::La clave de Groq del robot no vale (codigo $CODIGO_GROQ)."
              echo "Revisa el secreto GROQ_API_KEY en Settings -> Secrets and variables -> Actions."
              exit 1
              ;;
            429)
              echo "::error::Groq (el juez) no tiene cuota ahora mismo (429). NO es un problema de calidad."
              echo "La cuota diaria se renueva a medianoche UTC (2:00 en España)."
              echo "Vuelve a lanzarlo entonces desde Actions -> Publicar -> Run workflow."
              echo "Si el cambio no toca ningun prompt, el commit puede llevar [sin evals]."
              exit 1
              ;;
            *)
              echo "::error::Groq (el juez) responde $CODIGO_GROQ. No se lanzan los evals para no tirar 25 minutos."
              exit 1
              ;;
          esac

      # `-j 1` y las pausas se fijaron mientras Groq era el proveedor
      # principal de la app, porque limitaba por TOKENS POR MINUTO (8.000 en
      # esta cuenta) y esa cuenta sumaba la entrada MAS el `max_tokens`
      # pedido, se gastara o no.
      #
      # Las pausas salen de una division, no de una corazonada:
      #
      #   extraerPerfil    ~2.000 tokens/caso -> 25 s entre casos = 4.800 TPM
      #   generarCvYCarta  ~7.000 tokens/caso -> 65 s entre casos = 6.500 TPM
      #
      # Los valores anteriores (15 s y 20 s) pedian 8.000 y 21.000 TPM: el
      # segundo era 2,6 veces el limite, asi que el 429 estaba garantizado.
      # Verificado en vivo (ejecucion #3): 26m 55s para acabar en "no
      # concluyente" con medio dataset sin evaluar.
      #
      # Desde el 23/08/2026 Groq ya no genera ni extrae nada (Cloudflare no
      # limita por minuto, solo por cupo diario) — pero el juez de las
      # aserciones llm-rubric SIGUE llamando a Groq una vez por caso, y ese
      # mismo limite de TOKENS POR MINUTO le sigue aplicando a él. No se ha
      # tocado `-j 1` ni estas pausas sin poder relanzar los evals para
      # comprobarlo en vivo (Mar pidió no relanzarlos ahora, 23/08/2026): son
      # un techo mas conservador de lo que hace falta, no un problema.
      #
      # `|| true` deja que el eval termine aunque haya casos en rojo: quien
      # decide no es promptfoo, es la puerta del paso siguiente.
      - name: Evals · extraerPerfil (12 casos)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROMPTFOO_EVAL_TIMEOUT_MS: '180000'
          PROMPTFOO_MAX_EVAL_TIME_MS: '900000'
        run: |
          npx promptfoo eval -c evals/promptfoo/extraer-perfil.yaml \
            -j 1 --delay 25000 \
            -o evals/promptfoo/resultado-perfil.json || true

      - name: Evals · generarCvYCarta (13 casos)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROMPTFOO_EVAL_TIMEOUT_MS: '180000'
          PROMPTFOO_MAX_EVAL_TIME_MS: '1800000'
        run: |
          npx promptfoo eval -c evals/promptfoo/generar-cv-carta.yaml \
            -j 1 --delay 65000 \
            -o evals/promptfoo/resultado-generar.json || true

      # Aquí está la puerta. Sale con 0 (verde), 1 (rojo de calidad) o 2 (no
      # concluyente: sin cuota, juez caído...). Cualquiera que no sea 0 detiene
      # la publicación, pero el mensaje distingue de qué se trata.
      - name: Veredicto
        shell: bash
        run: |
          # `pipefail` es imprescindible aquí: sin él, el código de salida de la
          # tubería sería el de `tee` (siempre 0) y la puerta no bloquearía
          # nunca — parecería montada y no lo estaría.
          set -uo pipefail
          node evals/puerta-calidad.mjs \
            evals/promptfoo/resultado-perfil.json \
            evals/promptfoo/resultado-generar.json | tee veredicto.txt
          exit "${PIPESTATUS[0]}"

      - name: Anotar el veredicto
        if: always()
        run: |
          {
            echo '### Veredicto de los evals'
            echo ''
            echo '```'
            cat veredicto.txt 2>/dev/null || echo 'La puerta no llegó a dar un veredicto.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────
  # 4 · Publicar. Solo si todo lo anterior fue bien.
  # ─────────────────────────────────────────────────────────────────────
  publicar:
    name: Publicar en Vercel
    needs: [decidir, comprobar, evals]
    # `always()` hace que este trabajo se evalúe aunque "evals" se haya
    # saltado; las condiciones de dentro son las que mandan de verdad.
    # "skipped" cuenta como bueno (no había que lanzarlos); "failure" no.
    # `decidir` también tiene que haber ido bien: si reventara, "evals" se
    # saltaría y quedaría en "skipped", que es justo lo que aquí se acepta como
    # bueno. Sin esta línea, un fallo al decidir publicaría sin pasar los evals.
    if: |
      always()
      && needs.decidir.result == 'success'
      && needs.comprobar.result == 'success'
      && (needs.evals.result == 'success' || needs.evals.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar la herramienta de Vercel
        run: npm install --global vercel@latest

      - name: Decidir producción o vista previa
        id: destino
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "entorno=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
            echo "etiqueta=PRODUCCIÓN (la web que ven tus compañeras)" >> "$GITHUB_OUTPUT"
          else
            echo "entorno=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "etiqueta=vista previa (nadie más la ve)" >> "$GITHUB_OUTPUT"
          fi

      - name: Traer la configuración del proyecto
        run: vercel pull --yes --environment=${{ steps.destino.outputs.entorno }} --token=${{ secrets.VERCEL_TOKEN }}

      # Construye VERCEL, no este robot. La versión anterior hacía
      # `vercel build` aquí y subía el resultado ya hecho con `--prebuilt`;
      # parecía mejor (más control, un paso menos en Vercel) y estaba roto:
      #
      # Las variables `NEXT_PUBLIC_*` no se leen en tiempo de ejecución, se
      # INCRUSTAN dentro del código durante la construcción. Y como las cinco
      # variables del proyecto son de tipo **Sensitive**, su valor no se puede
      # recuperar desde fuera de Vercel — el mismo motivo por el que las claves
      # de IA tuvieron que pasar a secretos de GitHub. Resultado: el build de
      # aquí incrustaba una URL de Supabase vacía y la vista previa moría con
      # "Invalid supabaseUrl: Must be a valid HTTP or HTTPS URL" en el
      # middleware, con un escueto "Internal Server Error" en pantalla.
      # (Verificado en vivo el 20/08/2026, ejecución #4.)
      #
      # Construyendo en Vercel, las variables están donde tienen que estar. Se
      # pagan ~2 minutos más por despliegue; la puerta de calidad sigue siendo
      # este robot, que es lo que importa.
      - name: Publicar
        id: desplegar
        run: |
          # `--meta sha=` es lo que hace posible el arreglo de T115: deja
          # grabado en el despliegue QUÉ commit lleva dentro, para que la
          # próxima vez el paso `decidir` pueda preguntar qué hay publicado.
          # Hace falta ponerlo a mano porque el repositorio se desconectó del
          # proyecto en Vercel el 21/08/2026: Vercel ya no sabe de qué commit
          # viene un despliegue si no se lo decimos nosotros.
          URL=$(vercel deploy ${{ steps.destino.outputs.flag }}             --meta sha="$GITHUB_SHA"             --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Publicado en $URL"

      - name: Anotar dónde ha quedado
        run: |
          {
            echo '### Publicado'
            echo ''
            echo "- Destino: **${{ steps.destino.outputs.etiqueta }}**"
            echo "- Dirección: ${{ steps.desplegar.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
